<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shop | BUILT EVIL</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="navbar">

<a href="index.html" class="logo">BUILT EVIL</a>

<nav>

<a href="index.html">Home</a>
<a href="shop.html">Shop</a>
<a href="dashboard.html">Dashboard</a>
<a href="customer-care.html">Customer Care</a>

</nav>

<div class="nav-actions">

<a href="wishlist.html">♡</a>
<a href="cart.html">🛒 <span id="cartCount">0</span></a>
<a href="login.html">👤</a>

</div>

</header>


<main class="page">

<div class="page-title">

<p>BUILT EVIL COLLECTION</p>

<h1>SHOP ALL</h1>

</div>


<div class="shop-controls">

<input
type="text"
id="search"
placeholder="Search products..."
onkeyup="searchProducts()">

<select id="categoryFilter" onchange="filterProducts()">

<option value="all">All Categories</option>
<option value="shirts">Shirts</option>
<option value="hoodies">Hoodies</option>
<option value="pants">Pants</option>
<option value="accessories">Accessories</option>

</select>

</div>


<div class="product-grid" id="products">


<div class="product-card" data-name="Built Evil Oversized Tee" data-category="shirts">

<div class="product-image">

<img src="images/product1.jpg">

</div>

<div class="product-info">

<h3>BUILT EVIL OVERSIZED TEE</h3>

<p class="price">₦35,000</p>

<button
class="add-cart"
onclick="addToCart('BUILT EVIL OVERSIZED TEE',35000,'images/product1.jpg')">

ADD TO CART

</button>

</div>

</div>


<div class="product-card" data-name="Built Evil Hoodie" data-category="hoodies">

<div class="product-image">

<img src="images/product2.jpg">

</div>

<div class="product-info">

<h3>BUILT EVIL HOODIE</h3>

<p class="price">₦55,000</p>

<button
class="add-cart"
onclick="addToCart('BUILT EVIL HOODIE',55000,'images/product2.jpg')">

ADD TO CART

</button>

</div>

</div>


<div class="product-card" data-name="Built Evil Cargo Pants" data-category="pants">

<div class="product-image">

<span class="sold-label">SOLD OUT</span>

<img src="images/product3.jpg">

</div>

<div class="product-info">

<h3>BUILT EVIL CARGO PANTS</h3>

<p class="price">₦48,000</p>

<button disabled>SOLD OUT</button>

</div>

</div>


<div class="product-card" data-name="Built Evil Cap" data-category="accessories">

<div class="product-image">

<img src="images/product4.jpg">

</div>

<div class="product-info">

<h3>BUILT EVIL CAP</h3>

<p class="price">₦20,000</p>

<button
class="add-cart"
onclick="addToCart('BUILT EVIL CAP',20000,'images/product4.jpg')">

ADD TO CART

</button>

</div>

</div>


</div>

</main>

<script src="js/app.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Customer Care | BUILT EVIL</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        BUILT<span>EVIL</span>
    </a>

    <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="dashboard.html">Account</a>
    </nav>

</header>


<main class="contact-page">

    <p class="small-title">NEED HELP?</p>

    <h1>CUSTOMER CARE</h1>

    <div class="contact-grid">

        <div class="contact-info">

            <h2>CONTACT US</h2>

            <p>
                Email:
                support@builtevil.com
            </p>

            <p>
                Phone:
                +234 800 000 0000
            </p>

            <p>
                Monday – Saturday
            </p>

            <p>
                9:00 AM – 6:00 PM
            </p>

        </div>


        <form id="contact-form">

            <input
                type="text"
                placeholder="Your Name"
                required
            >

            <input
                type="email"
                placeholder="Your Email"
                required
            >

            <input
                type="text"
                placeholder="Subject"
                required
            >

            <textarea
                placeholder="How can we help?"
                required
            ></textarea>

            <button class="btn">
                SEND MESSAGE
            </button>

        </form>

    </div>

</main>


<script src="js/script.js"></script>

</body>
</html>
